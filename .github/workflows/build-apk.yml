name: Build MedControl APK

on:
  push:
    branches:
      - "claude/github-actions-apk-build-ecAOW"
      - "main"
    paths-ignore:
      - "build-output/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MedControl-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Commit APK to build-output
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          ls -lh "$APK"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          mkdir -p build-output
          cp "$APK" build-output/MedControl-debug.apk
          git add build-output/MedControl-debug.apk
          git diff-index --quiet HEAD || git commit -m "[skip ci] build: MedControl debug APK $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin HEAD
