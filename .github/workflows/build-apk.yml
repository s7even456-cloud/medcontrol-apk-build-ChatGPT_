name: Build MedControl APK

on:
  push:
    branches:
      - "claude/github-actions-apk-build-ecAOW"
      - "main"
    paths-ignore:
      - "build-output/**"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      - name: Upload APK as workflow artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: MedControl-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Commit results to branch
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git fetch origin
          # Attach HEAD to branch without touching working tree (preserves build output)
          git update-ref refs/heads/${{ github.ref_name }} origin/${{ github.ref_name }}
          git symbolic-ref HEAD refs/heads/${{ github.ref_name }}
          mkdir -p build-output
          {
            echo "=== POST-BUILD DIAGNOSTICS ==="
            ls -la app/build/outputs/apk/debug/ 2>&1 || echo "APK dir missing"
            echo "Git status: $(git status --short)"
          } >> /tmp/build.log || true
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-output/MedControl-debug.apk
            git add -f build-output/MedControl-debug.apk
            git diff-index --quiet HEAD || git commit -m "[skip ci] build: MedControl debug APK $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          else
            tail -400 /tmp/build.log > build-output/last-build-log.txt 2>/dev/null || echo "No log captured" > build-output/last-build-log.txt
            git add build-output/last-build-log.txt
            git diff-index --quiet HEAD || git commit -m "[skip ci] debug: build log $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi
          git push origin ${{ github.ref_name }}

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
